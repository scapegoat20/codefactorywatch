{% extends "base.html" %}
{% block title %}Log in - CodeFactory Watch{% endblock %}
{% block content %}
<div class="card" style="max-width:380px;margin:40px auto">
  <h1>Log in</h1>
  <form method="post">{% csrf_token %}
    {{ form.as_p }}
    {% if form.errors %}<p class="err">Wrong username or password.</p>{% endif %}
    <button class="btn" type="submit">Log in</button>
    <input type="hidden" name="next" value="{{ next }}">
  </form>
</div>
{% endblock %}
